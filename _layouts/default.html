<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <span class="site-desc">{{ site.description }}</span>
    </div>
  </header>

  <main class="wrap site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>由 GitHub Actions 每日自动抓取生成 ·
        数据源：
        <a href="https://news.smol.ai/">smol.ai</a> ·
        <a href="https://www.deeplearning.ai/the-batch">The Batch</a> ·
        <a href="https://huggingface.co/papers">HF Papers</a> ·
        <a href="https://arxiv.org/list/cs.AI/recent">arXiv cs.AI</a> ·
        <a href="https://artificialanalysis.ai/">Artificial Analysis</a> ·
        <a href="https://www.alphaxiv.org/">alphaXiv</a>
      </p>
    </div>
  </footer>
</body>
</html>
