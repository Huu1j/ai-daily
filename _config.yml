title: AI 日报
description: 每日自动聚合 —— AI 要闻 / 前沿论文 / 模型榜单
lang: zh-CN
theme: minima

url: ""
baseurl: "/ai-daily"

timezone: Asia/Shanghai

# 只构建 post 布局需要的内容，忽略脚本目录，避免 Jekyll 解析 Python
exclude:
  - scripts
  - .github
  - data
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .venv

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

minima:
  skin: classic

# 不要默认的 pretty/date 样式：它会把 categories 拼进路径，
# 中文分类会被编码成一长串 %E6%97%A5... 的丑链接。
permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap

# 站点级说明变量，供模板使用
repo: ""
enable_llm_summary: false
